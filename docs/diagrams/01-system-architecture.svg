  <text x="940" y="471" fill="#64748b" font-size="8" text-anchor="middle">8GB VRAM · CUDA 12.x</text>

  <line x1="448" y1="395" x2="448" y2="424" stroke="#34d399" stroke-width="2" marker-end="url(#ma-emerald)" opacity="0.8"/>
  <line x1="820" y1="460" x2="860" y2="457" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ma-violet)" opacity="0.7"/>

  <line x1="540" y1="512" x2="540" y2="562" stroke="#34d399" stroke-width="2" marker-end="url(#ma-emerald)" opacity="0.8"/>

