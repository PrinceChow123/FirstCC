<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(30,41,59,0.4)" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="0.8" fill="rgba(30,41,59,0.6)"/>
    </pattern>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="0.5" fill="rgba(30,41,59,0.3)"/>
    </pattern>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-emerald">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="g-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
    <linearGradient id="g-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C040"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="ma-cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#00D4AA"/>
    </marker>
    <marker id="ma-emerald" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#34d399"/>
    </marker>
    <marker id="ma-violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#a78bfa"/>
    </marker>
    <marker id="ma-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#F0C040"/>
    </marker>
    <marker id="ma-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#FF6B35"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="920" fill="#0A1628"/>
  <rect width="1200" height="920" fill="url(#grid)"/>

  <!-- Title -->
  <text x="36" y="38" fill="url(#g-title)" font-size="18" font-weight="700">WaterMonitor — System Architecture v1.0</text>
  <text x="36" y="58" fill="#64748b" font-size="10">Five-Layer Pipeline: Input → Preprocess → GPU Inference → Postprocess → Output | CGCS2000 · Grounding DINO + LoRA</text>
  <line x1="36" y1="66" x2="1164" y2="66" stroke="#1e3a5f" stroke-width="0.5"/>

  <!-- Electron Shell -->
  <rect x="20" y="80" width="1160" height="810" rx="14" fill="none" stroke="rgba(0,212,170,0.25)" stroke-width="1" stroke-dasharray="8,4"/>
  <rect x="26" y="74" width="180" height="16" rx="3" fill="#0A1628"/>
  <text x="34" y="86" fill="#00D4AA" font-size="10" font-weight="600">Electron Desktop (Windows)</text>

  <!-- L1: Input -->
  <rect x="40" y="108" width="1120" height="108" rx="10" fill="none" stroke="rgba(240,192,64,0.2)" stroke-width="1" stroke-dasharray="6,3"/>
  <rect x="48" y="102" width="150" height="16" rx="3" fill="#0A1628"/>
  <text x="56" y="114" fill="#F0C040" font-size="10" font-weight="600">INPUT LAYER · 输入层</text>

  <rect x="58" y="130" width="220" height="68" rx="8" fill="#0A1628"/>
  <rect x="58" y="130" width="220" height="68" rx="8" fill="rgba(240,192,64,0.08)" stroke="rgba(240,192,64,0.4)" stroke-width="1.5"/>
  <text x="168" y="154" fill="#F0C040" font-size="12" font-weight="600" text-anchor="middle">航拍单张照片</text>
  <text x="168" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">JPEG + EXIF GPS</text>
  <text x="168" y="188" fill="#64748b" font-size="8" text-anchor="middle">DJI / 飞马 / 纵横无人机</text>

  <rect x="310" y="130" width="220" height="68" rx="8" fill="#0A1628"/>
  <rect x="310" y="130" width="220" height="68" rx="8" fill="rgba(240,192,64,0.08)" stroke="rgba(240,192,64,0.4)" stroke-width="1.5"/>
  <text x="420" y="154" fill="#F0C040" font-size="12" font-weight="600" text-anchor="middle">DOM 正射影像</text>
  <text x="420" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">GeoTIFF + TFW 世界文件</text>
  <text x="420" y="188" fill="#64748b" font-size="8" text-anchor="middle">EPSG:4490 · CGCS2000 投影</text>

  <rect x="562" y="130" width="190" height="68" rx="8" fill="#0A1628"/>
  <rect x="562" y="130" width="190" height="68" rx="8" fill="rgba(240,192,64,0.04)" stroke="rgba(240,192,64,0.2)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="657" y="154" fill="#F0C040" font-size="11" font-weight="600" text-anchor="middle">视频流 (未来)</text>
  <text x="657" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">RTSP · 5G 图传</text>
  <text x="657" y="188" fill="#64748b" font-size="8" text-anchor="middle">Mavlink PX4 飞控</text>

  <rect x="784" y="130" width="360" height="68" rx="8" fill="#0A1628"/>
  <rect x="784" y="130" width="360" height="68" rx="8" fill="rgba(148,163,184,0.04)" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="964" y="154" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">标注数据库 (未来扩展)</text>
  <text x="964" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">人工复核记录 · 模型版本历史</text>
  <text x="964" y="188" fill="#64748b" font-size="8" text-anchor="middle">SQLite 本地 / PostgreSQL 远程</text>

  <line x1="168" y1="198" x2="168" y2="248" stroke="#F0C040" stroke-width="2" marker-end="url(#ma-amber)" opacity="0.8"/>
  <line x1="420" y1="198" x2="420" y2="248" stroke="#F0C040" stroke-width="2" marker-end="url(#ma-amber)" opacity="0.8"/>

  <!-- L2: Preprocessing -->
  <rect x="40" y="255" width="1120" height="98" rx="10" fill="none" stroke="rgba(255,107,53,0.2)" stroke-width="1" stroke-dasharray="6,3"/>
  <rect x="48" y="249" width="185" height="16" rx="3" fill="#0A1628"/>
  <text x="56" y="261" fill="#FF6B35" font-size="10" font-weight="600">PREPROCESSING LAYER · 预处理层</text>

  <rect x="58" y="275" width="240" height="58" rx="8" fill="#0A1628"/>
  <rect x="58" y="275" width="240" height="58" rx="8" fill="rgba(255,107,53,0.08)" stroke="rgba(255,107,53,0.35)" stroke-width="1.5"/>
  <text x="178" y="298" fill="#FF6B35" font-size="11" font-weight="600" text-anchor="middle">EXIF 元数据解析器</text>
  <text x="178" y="316" fill="#94a3b8" font-size="9" text-anchor="middle">GPS 坐标 · 相机姿态 · GSD 计算</text>

  <rect x="328" y="275" width="240" height="58" rx="8" fill="#0A1628"/>
  <rect x="328" y="275" width="240" height="58" rx="8" fill="rgba(255,107,53,0.08)" stroke="rgba(255,107,53,0.35)" stroke-width="1.5"/>
  <text x="448" y="298" fill="#FF6B35" font-size="11" font-weight="600" text-anchor="middle">DOM 滑动窗口切块</text>
  <text x="448" y="316" fill="#94a3b8" font-size="9" text-anchor="middle">1024×1024 px · overlap = 256px</text>

  <rect x="598" y="275" width="240" height="58" rx="8" fill="#0A1628"/>
