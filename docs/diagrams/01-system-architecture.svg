  <rect x="578" y="712" width="230" height="58" rx="8" fill="#0A1628"/>
  <rect x="578" y="712" width="230" height="58" rx="8" fill="rgba(0,212,170,0.08)" stroke="rgba(0,212,170,0.4)" stroke-width="1.5"/>
