  <text x="168" y="630" fill="#94a3b8" font-size="9" text-anchor="middle">IoU > 0.50 → 合并去重</text>

  <rect x="308" y="589" width="220" height="58" rx="8" fill="#0A1628"/>
  <rect x="308" y="589" width="220" height="58" rx="8" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.35)" stroke-width="1.5"/>
  <text x="418" y="612" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">小目标去噪</text>
  <text x="418" y="630" fill="#94a3b8" font-size="9" text-anchor="middle">面积 < 0.01 m² → 丢弃</text>

  <rect x="558" y="589" width="260" height="58" rx="8" fill="#0A1628"/>
  <rect x="558" y="589" width="260" height="58" rx="8" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.35)" stroke-width="1.5"/>
  <text x="688" y="612" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">像素坐标 → 地理坐标</text>
  <text x="688" y="630" fill="#94a3b8" font-size="9" text-anchor="middle">仿射变换 · CGCS2000 (EPSG:4490)</text>

  <rect x="848" y="589" width="290" height="58" rx="8" fill="#0A1628"/>
  <rect x="848" y="589" width="290" height="58" rx="8" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.35)" stroke-width="1.5"/>
  <text x="993" y="612" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">GeoJSON 序列化</text>
  <text x="993" y="630" fill="#94a3b8" font-size="9" text-anchor="middle">FeatureCollection · EPSG:4490</text>

  <line x1="278" y1="618" x2="308" y2="618" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ma-violet)" opacity="0.7"/>
  <line x1="528" y1="618" x2="558" y2="618" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ma-violet)" opacity="0.7"/>
  <line x1="818" y1="618" x2="848" y2="618" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ma-violet)" opacity="0.7"/>

