  <rect x="48" y="563" width="210" height="16" rx="3" fill="#0A1628"/>
  <text x="56" y="575" fill="#a78bfa" font-size="10" font-weight="600">POSTPROCESSING LAYER · 后处理层</text>

  <rect x="58" y="589" width="220" height="58" rx="8" fill="#0A1628"/>
