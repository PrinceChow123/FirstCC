  <line x1="448" y1="333" x2="448" y2="395" stroke="#FF6B35" stroke-width="2" marker-end="url(#ma-orange)" opacity="0.8"/>
  <line x1="178" y1="333" x2="178" y2="360" stroke="#FF6B35" stroke-width="1" opacity="0.6"/>
  <line x1="178" y1="360" x2="448" y2="360" stroke="#FF6B35" stroke-width="1" opacity="0.6"/>
  <line x1="718" y1="333" x2="718" y2="360" stroke="#FF6B35" stroke-width="1" opacity="0.6"/>
  <line x1="718" y1="360" x2="448" y2="360" stroke="#FF6B35" stroke-width="1" opacity="0.6"/>
