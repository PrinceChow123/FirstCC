<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(30,58,95,0.25)" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ma-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#F0C040"/>
    </marker>
    <marker id="ma-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#FF6B35"/>
    </marker>
    <marker id="ma-emerald" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#34d399"/>
    </marker>
    <marker id="ma-violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#a78bfa"/>
    </marker>
    <marker id="ma-cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#00D4AA"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>

  <!-- Background -->
  <rect width="960" height="780" fill="#0A1628"/>
  <rect width="960" height="780" fill="url(#grid)"/>

  <!-- Title -->
  <text x="40" y="36" fill="#00D4AA" font-size="18" font-weight="700">WaterMonitor 系统总体架构</text>
  <text x="40" y="56" fill="#64748b" font-size="10">无人机航拍 → AI 识别 → 地理定位 → 一键导出</text>

  <!-- ====== L1: Input ====== -->
  <rect x="40" y="78" width="880" height="90" rx="10" fill="none" stroke="rgba(240,192,64,0.2)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="56" y="100" fill="#F0C040" font-size="11" font-weight="600">输入层</text>

  <rect x="56" y="110" width="340" height="42" rx="8" fill="#0A1628" stroke="rgba(240,192,64,0.35)" stroke-width="1.5"/>
  <text x="226" y="128" fill="#F0C040" font-size="12" font-weight="600" text-anchor="middle">航拍照片</text>
  <text x="226" y="143" fill="#94a3b8" font-size="9" text-anchor="middle">JPEG + EXIF GPS</text>

  <rect x="426" y="110" width="340" height="42" rx="8" fill="#0A1628" stroke="rgba(240,192,64,0.35)" stroke-width="1.5"/>
  <text x="596" y="128" fill="#F0C040" font-size="12" font-weight="600" text-anchor="middle">正射影像</text>
  <text x="596" y="143" fill="#94a3b8" font-size="9" text-anchor="middle">GeoTIFF + TFW (CGCS2000)</text>

  <line x1="396" y1="131" x2="426" y2="131" stroke="#F0C040" stroke-width="1.5" opacity="0.5"/>

  <!-- Arrow L1→L2 -->
  <line x1="480" y1="168" x2="480" y2="198" stroke="#F0C040" stroke-width="2" marker-end="url(#ma-amber)" opacity="0.7"/>

  <!-- ====== L2: Preprocess ====== -->
  <rect x="40" y="205" width="880" height="90" rx="10" fill="none" stroke="rgba(255,107,53,0.2)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="56" y="227" fill="#FF6B35" font-size="11" font-weight="600">预处理层</text>

  <rect x="56" y="237" width="340" height="42" rx="8" fill="#0A1628" stroke="rgba(255,107,53,0.35)" stroke-width="1.5"/>
  <text x="226" y="255" fill="#FF6B35" font-size="12" font-weight="600" text-anchor="middle">GPS / EXIF 解析</text>
  <text x="226" y="270" fill="#94a3b8" font-size="9" text-anchor="middle">相机姿态 · GSD 计算 · 坐标提取</text>

  <rect x="426" y="237" width="340" height="42" rx="8" fill="#0A1628" stroke="rgba(255,107,53,0.35)" stroke-width="1.5"/>
  <text x="596" y="255" fill="#FF6B35" font-size="12" font-weight="600" text-anchor="middle">图像预处理</text>
  <text x="596" y="270" fill="#94a3b8" font-size="9" text-anchor="middle">滑动窗口切块 · 色彩归一化 · 尺寸缩放</text>

  <line x1="396" y1="258" x2="426" y2="258" stroke="#FF6B35" stroke-width="1.5" opacity="0.5"/>

  <!-- Arrow L2→L3 -->
  <line x1="480" y1="295" x2="480" y2="330" stroke="#FF6B35" stroke-width="2" marker-end="url(#ma-orange)" opacity="0.7"/>

  <!-- ====== L3: AI Inference ====== -->
  <rect x="40" y="337" width="880" height="100" rx="10" fill="none" stroke="rgba(52,211,153,0.25)" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="56" y="359" fill="#34d399" font-size="11" font-weight="600">AI 推理层 (GPU)</text>

  <rect x="56" y="371" width="280" height="48" rx="8" fill="#0A1628" stroke="rgba(52,211,153,0.4)" stroke-width="1.5" filter="url(#glow)"/>
  <text x="196" y="392" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Grounding DINO 1.5</text>
  <text x="196" y="409" fill="#94a3b8" font-size="9" text-anchor="middle">swint_ogc · FP16 · ~340MB</text>

  <rect x="366" y="371" width="220" height="48" rx="8" fill="#0A1628" stroke="rgba(52,211,153,0.35)" stroke-width="1.5"/>
  <text x="476" y="392" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">LoRA 适配器</text>
  <text x="476" y="409" fill="#94a3b8" font-size="9" text-anchor="middle">rank=16 · ~8MB · 可插拔</text>

  <rect x="616" y="371" width="170" height="48" rx="8" fill="#0A1628" stroke="rgba(167,139,250,0.35)" stroke-width="1.5"/>
  <text x="701" y="392" fill="#a78bfa" font-size="12" font-weight="600" text-anchor="middle">RTX 3070</text>
  <text x="701" y="409" fill="#94a3b8" font-size="9" text-anchor="middle">8GB · CUDA 加速</text>

  <line x1="336" y1="395" x2="366" y2="395" stroke="#34d399" stroke-width="1.5" opacity="0.5"/>
  <line x1="586" y1="395" x2="616" y2="395" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>

  <!-- Arrow L3→L4 -->
  <line x1="480" y1="437" x2="480" y2="467" stroke="#34d399" stroke-width="2" marker-end="url(#ma-emerald)" opacity="0.7"/>

  <!-- ====== L4: Postprocess ====== -->
  <rect x="40" y="474" width="880" height="90" rx="10" fill="none" stroke="rgba(167,139,250,0.2)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="56" y="496" fill="#a78bfa" font-size="11" font-weight="600">后处理层</text>

  <rect x="56" y="506" width="340" height="42" rx="8" fill="#0A1628" stroke="rgba(167,139,250,0.35)" stroke-width="1.5"/>
  <text x="226" y="524" fill="#a78bfa" font-size="12" font-weight="600" text-anchor="middle">去重 &amp; 过滤</text>
  <text x="226" y="539" fill="#94a3b8" font-size="9" text-anchor="middle">重叠窗口 NMS · 小目标去噪 · 置信度筛选</text>

  <rect x="426" y="506" width="340" height="42" rx="8" fill="#0A1628" stroke="rgba(167,139,250,0.35)" stroke-width="1.5"/>
  <text x="596" y="524" fill="#a78bfa" font-size="12" font-weight="600" text-anchor="middle">像素坐标 → 地理坐标</text>
  <text x="596" y="539" fill="#94a3b8" font-size="9" text-anchor="middle">仿射变换 · CGCS2000 (EPSG:4490) · GeoJSON</text>

  <line x1="396" y1="527" x2="426" y2="527" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>

  <!-- Arrow L4→L5 -->
  <line x1="480" y1="564" x2="480" y2="594" stroke="#a78bfa" stroke-width="2" marker-end="url(#ma-violet)" opacity="0.7"/>

  <!-- ====== L5: Output ====== -->
  <rect x="40" y="601" width="880" height="90" rx="10" fill="none" stroke="rgba(0,212,170,0.25)" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="56" y="623" fill="#00D4AA" font-size="11" font-weight="600">输出层</text>

  <rect x="56" y="633" width="340" height="42" rx="8" fill="#0A1628" stroke="rgba(0,212,170,0.35)" stroke-width="1.5"/>
  <text x="226" y="651" fill="#00D4AA" font-size="12" font-weight="600" text-anchor="middle">GeoJSON 标注文件</text>
  <text x="226" y="666" fill="#94a3b8" font-size="9" text-anchor="middle">FeatureCollection · 直接导入 QGIS/ArcGIS</text>

  <rect x="426" y="633" width="340" height="42" rx="8" fill="#0A1628" stroke="rgba(0,212,170,0.35)" stroke-width="1.5"/>
  <text x="596" y="651" fill="#00D4AA" font-size="12" font-weight="600" text-anchor="middle">预览影像 + 数据看板</text>
  <text x="596" y="666" fill="#94a3b8" font-size="9" text-anchor="middle">检测框叠印 · 统计图表 · 热力图</text>

  <line x1="396" y1="654" x2="426" y2="654" stroke="#00D4AA" stroke-width="1.5" opacity="0.5"/>

  <!-- ====== Electron Shell ====== -->
  <rect x="40" y="714" width="880" height="48" rx="8" fill="#0A1628" stroke="rgba(0,212,170,0.3)" stroke-width="1.5"/>
  <text x="480" y="735" fill="#00D4AA" font-size="11" font-weight="600" text-anchor="middle">Electron 桌面应用 · Vue 3 + Python FastAPI (localhost) · Windows 原生</text>
  <text x="480" y="752" fill="#64748b" font-size="9" text-anchor="middle">双击 Setup.exe 安装 · 无需联网 · 数据不出电脑</text>

  <!-- Edge connectors between layers -->
  <line x1="32" y1="131" x2="32" y2="654" stroke="rgba(255,255,255,0.04)" stroke-width="80"/>
</svg>
