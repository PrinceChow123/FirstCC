  <text x="56" y="408" fill="#34d399" font-size="10" font-weight="600">INFERENCE LAYER · GPU 推理层</text>

  <rect x="260" y="424" width="560" height="88" rx="10" fill="#0A1628"/>
  <rect x="260" y="424" width="560" height="88" rx="10" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.5)" stroke-width="2" filter="url(#glow-emerald)"/>
  <text x="540" y="450" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">Grounding DINO 1.5</text>
  <text x="540" y="470" fill="#94a3b8" font-size="10" text-anchor="middle">swint_ogc backbone · ~340MB · FP16 精度推理</text>
  <text x="540" y="488" fill="#64748b" font-size="9" text-anchor="middle">Text Prompt: "floating garbage . trash . debris on water surface"</text>
  <text x="540" y="504" fill="#F0C040" font-size="9" text-anchor="middle">LoRA Adapter (~8MB) · rank=16 · alpha=32 · 可训练参数仅 2M</text>

  <rect x="860" y="436" width="160" height="42" rx="6" fill="#0A1628"/>
  <rect x="860" y="436" width="160" height="42" rx="6" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>
