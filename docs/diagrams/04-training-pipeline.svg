<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <linearGradient id="grad-data" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>

  <rect width="1000" height="800" fill="#0f172a"/>
  <rect width="1000" height="800" fill="url(#grid)"/>

  <text x="30" y="35" fill="#22d3ee" font-size="18" font-weight="700">WaterMonitor — Fine-tune 训练流水线</text>
  <text x="30" y="55" fill="#64748b" font-size="10">Grounding DINO 1.5 + LoRA · 50 样本起步 → 持续迭代</text>

  <!-- ====== Phase 1: Data Prep ====== -->
  <rect x="30" y="75" width="940" height="180" rx="8" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="42" y="93" fill="#fbbf24" font-size="10" font-weight="600">PHASE 1 · 数据准备</text>

  <!-- Raw data -->
  <rect x="50" y="105" width="180" height="65" rx="6" fill="#0f172a"/>
  <rect x="50" y="105" width="180" height="65" rx="6" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="140" y="130" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">50 张原始标注</text>
  <text x="140" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">COCO JSON 格式</text>
  <text x="140" y="162" fill="#64748b" font-size="8" text-anchor="middle">手动 LabelStudio 标注</text>

  <line x1="230" y1="137" x2="270" y2="137" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Augmentation -->
  <rect x="280" y="100" width="250" height="140" rx="8" fill="#0f172a"/>
  <rect x="280" y="100" width="250" height="140" rx="8" fill="rgba(251,146,60,0.1)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="405" y="122" fill="#fb923c" font-size="11" font-weight="600" text-anchor="middle">强数据增强 ×20</text>

  <!-- Aug sub-items -->
  <rect x="295" y="132" width="105" height="24" rx="3" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="0.5"/>
  <text x="347" y="148" fill="#94a3b8" font-size="8" text-anchor="middle">随机旋转 ±45°</text>

  <rect x="410" y="132" width="105" height="24" rx="3" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="0.5"/>
  <text x="462" y="148" fill="#94a3b8" font-size="8" text-anchor="middle">色彩抖动</text>

  <rect x="295" y="164" width="105" height="24" rx="3" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="0.5"/>
  <text x="347" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">缩放 0.5~1.5×</text>

  <rect x="410" y="164" width="105" height="24" rx="3" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="0.5"/>
  <text x="462" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">Mosaic 4-in-1</text>

  <rect x="295" y="196" width="220" height="24" rx="3" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="0.5"/>
  <text x="405" y="212" fill="#94a3b8" font-size="8" text-anchor="middle">水面反射模拟 (亮度噪声)</text>

  <line x1="530" y1="170" x2="575" y2="170" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Output: augmented dataset -->
  <rect x="585" y="120" width="180" height="55" rx="6" fill="#0f172a"/>
  <rect x="585" y="120" width="180" height="55" rx="6" fill="rgba(6,78,59,0.2)" stroke="#34d399" stroke-width="1.5"/>
  <text x="675" y="143" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">~1000 张训练集</text>
  <text x="675" y="160" fill="#94a3b8" font-size="9" text-anchor="middle">+ 5 张留出验证集</text>

  <!-- Arrow to train -->
  <line x1="675" y1="175" x2="675" y2="280" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- ====== Phase 2: Training ====== -->
  <rect x="30" y="285" width="940" height="200" rx="8" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="6,3" opacity="0.6"/>
  <text x="42" y="303" fill="#34d399" font-size="10" font-weight="600">PHASE 2 · LoRA 微调训练</text>

  <!-- Backbone frozen -->
  <rect x="80" y="320" width="160" height="70" rx="6" fill="#0f172a"/>
  <rect x="80" y="320" width="160" height="70" rx="6" fill="rgba(30,41,59,0.4)" stroke="#64748b" stroke-width="1.5"/>
  <text x="160" y="345" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">Grounding DINO</text>
  <text x="160" y="362" fill="#94a3b8" font-size="9" text-anchor="middle">基座权重冻结</text>
  <text x="160" y="378" fill="#64748b" font-size="8" text-anchor="middle">swint_ogc · 340MB</text>

  <line x1="240" y1="355" x2="280" y2="355" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- LoRA insertion -->
  <rect x="290" y="315" width="180" height="85" rx="6" fill="#0f172a"/>
  <rect x="290" y="315" width="180" height="85" rx="6" fill="rgba(6,78,59,0.2)" stroke="#34d399" stroke-width="2"/>
  <text x="380" y="340" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">LoRA Adapter</text>
  <text x="380" y="360" fill="#94a3b8" font-size="9" text-anchor="middle">rank=16 · alpha=32</text>
  <text x="380" y="376" fill="#94a3b8" font-size="9" text-anchor="middle">target: q_proj, v_proj</text>
  <text x="380" y="392" fill="#64748b" font-size="8" text-anchor="middle">可训练参数 ~2M</text>

  <line x1="470" y1="357" x2="510" y2="357" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- Training loop -->
  <rect x="520" y="315" width="200" height="85" rx="6" fill="#0f172a"/>
  <rect x="520" y="315" width="200" height="85" rx="6" fill="rgba(6,78,59,0.15)" stroke="#34d399" stroke-width="1.5"/>
  <text x="620" y="340" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">训练配置</text>
  <text x="620" y="358" fill="#94a3b8" font-size="9" text-anchor="middle">batch_size=4 · epochs=30</text>
  <text x="620" y="374" fill="#94a3b8" font-size="9" text-anchor="middle">lr=1e-4 (cosine decay)</text>
  <text x="620" y="390" fill="#64748b" font-size="8" text-anchor="middle">~15 min on RTX 3070</text>

  <line x1="720" y1="357" x2="760" y2="357" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- Output: LoRA weights -->
  <rect x="770" y="320" width="170" height="75" rx="6" fill="#0f172a"/>
  <rect x="770" y="320" width="170" height="75" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="2" filter="url(#arrow-emerald)"/>
  <text x="855" y="345" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">LoRA 权重</text>
  <text x="855" y="365" fill="#94a3b8" font-size="9" text-anchor="middle">adapter.bin · ~8MB</text>
  <text x="855" y="382" fill="#64748b" font-size="8" text-anchor="middle">+ 基座模型 = 推理</text>

  <!-- Validation -->
  <rect x="320" y="420" width="360" height="45" rx="6" fill="#0f172a"/>
  <rect x="320" y="420" width="360" height="45" rx="6" fill="rgba(76,29,149,0.15)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="500" y="443" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">验证集评估 (5张留出) · mAP@0.5 · 不合理 → 调参再训</text>
  <text x="500" y="458" fill="#64748b" font-size="8" text-anchor="middle">loss 曲线监控 · 早停 patience=5</text>

  <!-- ====== Phase 3: Data Flywheel ====== -->
  <rect x="30" y="510" width="940" height="130" rx="8" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="6,3" opacity="0.4"/>
  <text x="42" y="528" fill="#fb7185" font-size="10" font-weight="600">PHASE 3 · 数据飞轮 &amp; 版本管理</text>

  <rect x="60" y="545" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="60" y="545" width="200" height="70" rx="6" fill="rgba(136,19,55,0.1)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="160" y="568" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">人工复核入库</text>
  <text x="160" y="585" fill="#94a3b8" font-size="9" text-anchor="middle">每修正1个框 = 1条新标注</text>
  <text x="160" y="602" fill="#64748b" font-size="8" text-anchor="middle">主动学习: 低置信度优先</text>

  <line x1="260" y1="580" x2="310" y2="580" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>

  <rect x="320" y="545" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="320" y="545" width="200" height="70" rx="6" fill="rgba(136,19,55,0.1)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="420" y="568" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">触发更新条件</text>
  <text x="420" y="585" fill="#94a3b8" font-size="9" text-anchor="middle">累积 ≥ 20 张新标注</text>
  <text x="420" y="602" fill="#64748b" font-size="8" text-anchor="middle">或 mAP 波动 &gt; 5%</text>

  <line x1="520" y1="580" x2="570" y2="580" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>

  <rect x="580" y="545" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="580" y="545" width="200" height="70" rx="6" fill="rgba(136,19,55,0.1)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="680" y="568" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">增量 LoRA 更新</text>
  <text x="680" y="585" fill="#94a3b8" font-size="9" text-anchor="middle">仅训练新数据 + 旧抽样</text>
  <text x="680" y="602" fill="#64748b" font-size="8" text-anchor="middle">防止灾难性遗忘</text>

  <line x1="780" y1="580" x2="810" y2="580" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>

  <rect x="820" y="545" width="120" height="70" rx="6" fill="#0f172a"/>
  <rect x="820" y="545" width="120" height="70" rx="6" fill="rgba(30,41,59,0.4)" stroke="#64748b" stroke-width="1.5"/>
  <text x="880" y="568" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">版本快照</text>
  <text x="880" y="585" fill="#94a3b8" font-size="9" text-anchor="middle">v1.2.3·0527</text>
  <text x="880" y="602" fill="#64748b" font-size="8" text-anchor="middle">一键回滚</text>

  <!-- ====== Phase 4: Roadmap ====== -->
  <rect x="30" y="665" width="940" height="115" rx="8" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="6,3" opacity="0.3"/>
  <text x="42" y="683" fill="#22d3ee" font-size="10" font-weight="600">ROADMAP · 数据扩充路径</text>

  <rect x="55" y="700" width="200" height="60" rx="6" fill="#0f172a"/>
  <rect x="55" y="700" width="200" height="60" rx="6" fill="rgba(8,51,68,0.2)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="155" y="723" fill="#22d3ee" font-size="10" font-weight="700" text-anchor="middle">Phase 1: 50 样本</text>
  <text x="155" y="740" fill="#94a3b8" font-size="9" text-anchor="middle">LoRA + 增强 → mAP 0.55</text>
  <text x="155" y="754" fill="#64748b" font-size="8" text-anchor="middle">(当前起点)</text>

  <line x1="255" y1="730" x2="285" y2="730" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <rect x="295" y="700" width="200" height="60" rx="6" fill="#0f172a"/>
  <rect x="295" y="700" width="200" height="60" rx="6" fill="rgba(8,51,68,0.2)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="395" y="723" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Phase 2: 120 样本</text>
  <text x="395" y="740" fill="#94a3b8" font-size="9" text-anchor="middle">+TACO 公开集 → mAP 0.68</text>
  <text x="395" y="754" fill="#64748b" font-size="8" text-anchor="middle">领域适配微调</text>

  <line x1="495" y1="730" x2="525" y2="730" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <rect x="535" y="700" width="200" height="60" rx="6" fill="#0f172a"/>
  <rect x="535" y="700" width="200" height="60" rx="6" fill="rgba(8,51,68,0.2)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="635" y="723" fill="#fb923c" font-size="10" font-weight="700" text-anchor="middle">Phase 3: 300 样本</text>
  <text x="635" y="740" fill="#94a3b8" font-size="9" text-anchor="middle">飞轮积累 → mAP 0.78</text>
  <text x="635" y="754" fill="#64748b" font-size="8" text-anchor="middle">主动学习筛选</text>

  <line x1="735" y1="730" x2="765" y2="730" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <rect x="775" y="700" width="170" height="60" rx="6" fill="#0f172a"/>
  <rect x="775" y="700" width="170" height="60" rx="6" fill="rgba(8,51,68,0.2)" stroke="#34d399" stroke-width="1.5"/>
  <text x="860" y="723" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Phase 4: 500+ 样本</text>
  <text x="860" y="740" fill="#94a3b8" font-size="9" text-anchor="middle">GAN 罕见样本 → 0.85</text>
  <text x="860" y="754" fill="#64748b" font-size="8" text-anchor="middle">雨雾夜晚泛化</text>
</svg>