<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <linearGradient id="grad-flow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>

  <rect width="1000" height="1100" fill="#0A1628"/>
  <rect width="1000" height="1100" fill="url(#grid)"/>

  <text x="30" y="35" fill="#22d3ee" font-size="18" font-weight="700">WaterMonitor — 检测流水线</text>
  <text x="30" y="55" fill="#64748b" font-size="10">数据流: 原始影像 → GeoJSON 标注文件 (CGCS2000)</text>

  <!-- ====== STEP 1: Raw Input ====== -->
  <rect x="80" y="80" width="280" height="80" rx="8" fill="#0A1628"/>
  <rect x="80" y="80" width="280" height="80" rx="8" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="2"/>
  <text x="220" y="108" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">① 原始影像输入</text>
  <text x="220" y="130" fill="#94a3b8" font-size="10" text-anchor="middle">单张航拍: JPEG + EXIF GPS</text>
  <text x="220" y="148" fill="#64748b" font-size="9" text-anchor="middle">DOM: GeoTIFF + TFW (EPSG:4490)</text>

  <line x1="360" y1="120" x2="460" y2="120" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="410" y="112" fill="#fbbf24" font-size="8" text-anchor="middle">导入</text>

  <!-- ====== STEP 2: Preprocessing ====== -->
  <rect x="470" y="80" width="450" height="80" rx="8" fill="#0A1628"/>
  <rect x="470" y="80" width="450" height="80" rx="8" fill="rgba(251,146,60,0.15)" stroke="#fb923c" stroke-width="2"/>

  <!-- Sub-steps -->
  <rect x="485" y="95" width="130" height="50" rx="4" fill="#0A1628"/>
  <rect x="485" y="95" width="130" height="50" rx="4" fill="rgba(30,41,59,0.4)" stroke="#64748b" stroke-width="1"/>
  <text x="550" y="116" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">单图</text>
  <text x="550" y="132" fill="#64748b" font-size="8" text-anchor="middle">EXIF GPS 提取</text>

  <line x1="615" y1="120" x2="635" y2="120" stroke="#64748b" stroke-width="1"/>

  <rect x="640" y="95" width="130" height="50" rx="4" fill="#0A1628"/>
  <rect x="640" y="95" width="130" height="50" rx="4" fill="rgba(30,41,59,0.4)" stroke="#64748b" stroke-width="1"/>
  <text x="705" y="116" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">DOM</text>
  <text x="705" y="132" fill="#64748b" font-size="8" text-anchor="middle">滑动窗口切块</text>

  <line x1="770" y1="120" x2="790" y2="120" stroke="#64748b" stroke-width="1"/>

  <rect x="795" y="95" width="110" height="50" rx="4" fill="#0A1628"/>
  <rect x="795" y="95" width="110" height="50" rx="4" fill="rgba(30,41,59,0.4)" stroke="#64748b" stroke-width="1"/>
  <text x="850" y="116" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">统一</text>
  <text x="850" y="132" fill="#64748b" font-size="8" text-anchor="middle">tensor batch</text>

  <line x1="695" y1="160" x2="695" y2="200" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="720" y="185" fill="#fb923c" font-size="8">标准化 tensor</text>

  <!-- ====== STEP 3: Inference ====== -->
  <rect x="240" y="205" width="520" height="100" rx="8" fill="#0A1628"/>
  <rect x="240" y="205" width="520" height="100" rx="8" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="2"/>

  <text x="500" y="230" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">② 模型推理 (CUDA GPU)</text>

  <text x="500" y="255" fill="#94a3b8" font-size="10" text-anchor="middle">Grounding DINO 1.5 · swint_ogc · FP16</text>

  <!-- Model internal -->
  <rect x="270" y="265" width="100" height="28" rx="4" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="320" y="283" fill="#22d3ee" font-size="8" font-weight="600" text-anchor="middle">Vision Encoder</text>

  <rect x="390" y="265" width="100" height="28" rx="4" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="440" y="283" fill="#22d3ee" font-size="8" font-weight="600" text-anchor="middle">Text Encoder</text>

  <rect x="510" y="265" width="100" height="28" rx="4" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="560" y="283" fill="#22d3ee" font-size="8" font-weight="600" text-anchor="middle">Cross-Attn</text>

  <rect x="630" y="265" width="100" height="28" rx="4" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="680" y="283" fill="#22d3ee" font-size="8" font-weight="600" text-anchor="middle">BBox Head</text>

  <line x1="370" y1="279" x2="390" y2="279" stroke="#22d3ee" stroke-width="1" marker-end="url(#arrow-cyan)"/>
  <line x1="490" y1="279" x2="510" y2="279" stroke="#22d3ee" stroke-width="1" marker-end="url(#arrow-cyan)"/>
  <line x1="610" y1="279" x2="630" y2="279" stroke="#22d3ee" stroke-width="1" marker-end="url(#arrow-cyan)"/>

  <line x1="500" y1="305" x2="500" y2="345" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <text x="525" y="330" fill="#34d399" font-size="8">detections[N]</text>

  <!-- ====== STEP 4: Post-processing ====== -->
  <rect x="80" y="350" width="840" height="250" rx="8" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="92" y="368" fill="#a78bfa" font-size="9" font-weight="600">③ 后处理流水线</text>

  <!-- Step 4a -->
  <rect x="100" y="380" width="240" height="60" rx="6" fill="#0A1628"/>
  <rect x="100" y="380" width="240" height="60" rx="6" fill="rgba(76,29,149,0.15)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="220" y="403" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">4a. 重叠窗口 NMS</text>
  <text x="220" y="420" fill="#94a3b8" font-size="9" text-anchor="middle">DOM 切块重叠区域去重</text>
  <text x="220" y="434" fill="#64748b" font-size="8" text-anchor="middle">IoU threshold = 0.5</text>

  <line x1="340" y1="410" x2="380" y2="410" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- Step 4b -->
  <rect x="390" y="380" width="240" height="60" rx="6" fill="#0A1628"/>
  <rect x="390" y="380" width="240" height="60" rx="6" fill="rgba(76,29,149,0.15)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="510" y="403" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">4b. 置信度过滤</text>
  <text x="510" y="420" fill="#94a3b8" font-size="9" text-anchor="middle">高置信(&gt;0.6)→ 自动确认</text>
  <text x="510" y="434" fill="#64748b" font-size="8" text-anchor="middle">中置信(0.35~0.6)→ 人工复核</text>

  <line x1="630" y1="410" x2="670" y2="410" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- Step 4c -->
  <rect x="680" y="380" width="220" height="60" rx="6" fill="#0A1628"/>
  <rect x="680" y="380" width="220" height="60" rx="6" fill="rgba(76,29,149,0.15)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="790" y="403" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">4c. 小目标去噪</text>
  <text x="790" y="420" fill="#94a3b8" font-size="9" text-anchor="middle">面积 &lt; 0.01 m² → 丢弃</text>
  <text x="790" y="434" fill="#64748b" font-size="8" text-anchor="middle">波浪/光斑误检过滤</text>

  <line x1="220" y1="440" x2="220" y2="475" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <line x1="510" y1="440" x2="510" y2="475" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <line x1="790" y1="440" x2="790" y2="475" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- Step 4d: geolocation (merged) -->
  <rect x="100" y="480" width="800" height="60" rx="6" fill="#0A1628"/>
  <rect x="100" y="480" width="800" height="60" rx="6" fill="rgba(76,29,149,0.2)" stroke="#a78bfa" stroke-width="2"/>

  <rect x="115" y="495" width="370" height="30" rx="4" fill="#0A1628"/>
  <rect x="115" y="495" width="370" height="30" rx="4" fill="rgba(30,41,59,0.4)" stroke="#64748b" stroke-width="1"/>
  <text x="300" y="515" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">4d. 单图: 像素偏移 + EXIF GPS + GSD → 经纬度</text>

  <rect x="515" y="495" width="370" height="30" rx="4" fill="#0A1628"/>
  <rect x="515" y="495" width="370" height="30" rx="4" fill="rgba(30,41,59,0.4)" stroke="#64748b" stroke-width="1"/>
  <text x="700" y="515" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">4d. DOM: rasterio.xy() 仿射变换 → 经纬度</text>

  <line x1="500" y1="540" x2="500" y2="580" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>

  <text x="525" y="572" fill="#a78bfa" font-size="8">坐标列表</text>

  <!-- ====== STEP 5: Output ====== -->
  <rect x="240" y="585" width="520" height="100" rx="8" fill="#0A1628"/>
  <rect x="240" y="585" width="520" height="100" rx="8" fill="rgba(8,51,68,0.25)" stroke="#22d3ee" stroke-width="2"/>

  <text x="500" y="612" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="middle">④ 输出生成</text>

  <rect x="265" y="628" width="150" height="42" rx="4" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="340" y="648" fill="#22d3ee" font-size="9" font-weight="600" text-anchor="middle">GeoJSON</text>
  <text x="340" y="662" fill="#64748b" font-size="8" text-anchor="middle">CGCS2000</text>

  <rect x="440" y="628" width="150" height="42" rx="4" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="515" y="648" fill="#22d3ee" font-size="9" font-weight="600" text-anchor="middle">标注影像</text>
  <text x="515" y="662" fill="#64748b" font-size="8" text-anchor="middle">JPEG + 框叠印</text>

  <rect x="615" y="628" width="120" height="42" rx="4" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="675" y="648" fill="#22d3ee" font-size="9" font-weight="600" text-anchor="middle">CSV 报表</text>
  <text x="675" y="662" fill="#64748b" font-size="8" text-anchor="middle">Excel 兼容</text>

  <!-- ====== Data Flywheel sidebar ====== -->
  <rect x="60" y="720" width="880" height="340" rx="8" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="6,3" opacity="0.4"/>
  <text x="72" y="738" fill="#fb7185" font-size="9" font-weight="600">⑤ 数据飞轮 (持续改进)</text>

  <!-- Flywheel -->
  <rect x="120" y="760" width="200" height="60" rx="6" fill="#0A1628"/>
  <rect x="120" y="760" width="200" height="60" rx="6" fill="rgba(136,19,55,0.15)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="220" y="783" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">人工复核</text>
  <text x="220" y="800" fill="#94a3b8" font-size="9" text-anchor="middle">修正框 · 删除误报</text>
  <text x="220" y="814" fill="#64748b" font-size="8" text-anchor="middle">操作记录 → 标注数据库</text>

  <line x1="320" y1="790" x2="400" y2="790" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>

  <rect x="410" y="760" width="200" height="60" rx="6" fill="#0A1628"/>
  <rect x="410" y="760" width="200" height="60" rx="6" fill="rgba(136,19,55,0.15)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="510" y="783" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">触发重训</text>
  <text x="510" y="800" fill="#94a3b8" font-size="9" text-anchor="middle">累积 20 张新标注</text>
  <text x="510" y="814" fill="#64748b" font-size="8" text-anchor="middle">LoRA 增量更新 · ~8MB</text>

  <line x1="610" y1="790" x2="670" y2="790" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>

  <rect x="680" y="760" width="200" height="60" rx="6" fill="#0A1628"/>
  <rect x="680" y="760" width="200" height="60" rx="6" fill="rgba(136,19,55,0.15)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="780" y="783" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">版本管理</text>
  <text x="780" y="800" fill="#94a3b8" font-size="9" text-anchor="middle">模型版本 + 时间戳</text>
  <text x="780" y="814" fill="#64748b" font-size="8" text-anchor="middle">一键回滚</text>

  <!-- Back arrow -->
  <path d="M 780 820 Q 780 870 500 870 Q 220 870 220 820" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-rose)"/>
  <text x="500" y="855" fill="#fb7185" font-size="8" text-anchor="middle">模型升级 → 推理精度提升 → 更少人工复核 → 更快积累</text>

  <!-- Performance metrics -->
  <rect x="120" y="890" width="240" height="70" rx="6" fill="#0A1628"/>
  <rect x="120" y="890" width="240" height="70" rx="6" fill="rgba(6,78,59,0.15)" stroke="#34d399" stroke-width="1"/>
  <text x="240" y="912" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Phase 1: 50样本</text>
  <text x="240" y="930" fill="#94a3b8" font-size="9" text-anchor="middle">LoRA + 增强 → mAP ~0.55</text>
  <text x="240" y="948" fill="#64748b" font-size="8" text-anchor="middle">RTX 3070 · ~200ms/img</text>

  <rect x="400" y="890" width="240" height="70" rx="6" fill="#0A1628"/>
  <rect x="400" y="890" width="240" height="70" rx="6" fill="rgba(6,78,59,0.15)" stroke="#34d399" stroke-width="1"/>
  <text x="520" y="912" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Phase 2: 120样本</text>
  <text x="520" y="930" fill="#94a3b8" font-size="9" text-anchor="middle">+ TACO 公开集 → mAP ~0.68</text>
  <text x="520" y="948" fill="#64748b" font-size="8" text-anchor="middle">数据降噪 · 领域适配</text>

  <rect x="680" y="890" width="240" height="70" rx="6" fill="#0A1628"/>
  <rect x="680" y="890" width="240" height="70" rx="6" fill="rgba(6,78,59,0.15)" stroke="#34d399" stroke-width="1"/>
  <text x="800" y="912" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Phase 3: 500+样本</text>
  <text x="800" y="930" fill="#94a3b8" font-size="9" text-anchor="middle">飞轮积累 + GAN → mAP ~0.85</text>
  <text x="800" y="948" fill="#64748b" font-size="8" text-anchor="middle">复杂天候泛化</text>

  <!-- Legend -->
  <rect x="30" y="1010" width="940" height="55" rx="6" fill="#0A1628" stroke="#1e293b" stroke-width="1"/>
  <rect x="50" y="1022" width="14" height="14" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="72" y="1034" fill="#94a3b8" font-size="8">输入/输出</text>
  <rect x="160" y="1022" width="14" height="14" rx="2" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="182" y="1034" fill="#94a3b8" font-size="8">GPU 推理</text>
  <rect x="280" y="1022" width="14" height="14" rx="2" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="302" y="1034" fill="#94a3b8" font-size="8">后处理</text>
  <rect x="400" y="1022" width="14" height="14" rx="2" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
  <text x="422" y="1034" fill="#94a3b8" font-size="8">数据飞轮</text>
  <rect x="540" y="1022" width="14" height="14" rx="2" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1"/>
  <text x="562" y="1034" fill="#94a3b8" font-size="8">预处理</text>
  <rect x="660" y="1022" width="14" height="14" rx="2" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="682" y="1034" fill="#94a3b8" font-size="8">前端/输出</text>

  <text x="860" y="1034" fill="#64748b" font-size="8">全部坐标系: CGCS2000 (EPSG:4490)</text>
</svg>