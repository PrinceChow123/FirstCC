<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WaterMonitor — 无人机水面垃圾智能识别系统</title>
<style>
  :root {
    --bg: #0A1628;
    --surface: rgba(15, 31, 58, 0.7);
    --border: rgba(30, 58, 95, 0.6);
    --cyan: #00D4AA;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .container {
    position: relative;
    z-index: 1;
    max-width: 720px;
    text-align: center;
    padding: 40px;
    animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(0,212,170,0.08) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
    50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  }
  h1 {
    font-size: 2.8rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: .25em;
    background: linear-gradient(135deg, var(--cyan) 0%, #34d399 50%, #06b6d4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s ease-in-out infinite;
    background-size: 200% 200%;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .subtitle {
    font-size: 1.1rem;
    color: var(--text2);
    margin-bottom: 2.5em;
    letter-spacing: 0.02em;
  }
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 2em;
  }
  .card {
    position: relative;
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 28px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
    cursor: pointer;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,212,170,0.05), transparent);
    transition: left 0.6s ease;
  }
  .card:hover::before { left: 100%; }
  .card:hover {
    border-color: rgba(0,212,170,0.6);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,212,170,0.1), 0 0 0 1px rgba(0,212,170,0.1) inset;
  }
  .card .icon {
    font-size: 2.8rem;
    margin-bottom: .6em;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .card:hover .icon { transform: scale(1.1) translateY(-4px); }
  .card h3 {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: .4em;
    letter-spacing: -0.01em;
  }
  .card p {
    font-size: .9rem;
    color: var(--text2);
    line-height: 1.6;
  }
  .card .badge {
    display: inline-block;
    margin-top: .8em;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 600;
    background: rgba(0,212,170,0.12);
    color: var(--cyan);
    border: 1px solid rgba(0,212,170,0.25);
  }
  .footer {
    margin-top: 3em;
    font-size: .82rem;
    color: var(--text3);
    letter-spacing: 0.03em;
  }
  .footer span { color: var(--cyan); }
  @media (max-width: 600px) {
    .cards { grid-template-columns: 1fr; }
    h1 { font-size: 2rem; }
    .container { padding: 24px; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container">
  <div class="logo-glow"></div>
  <h1>WaterMonitor</h1>
  <div class="subtitle">无人机水面垃圾智能识别系统 · 设计文档</div>

  <div class="cards">
    <a class="card" href="design-plain.html">
      <div class="icon">📖</div>
      <h3>通俗版</h3>
      <p>面向非技术人员的介绍<br>回答"是什么、怎么用、需要什么"</p>
      <div class="badge">5 分钟阅读</div>
    </a>
    <a class="card" href="design-presentation.html">
      <div class="icon">⚙️</div>
      <h3>技术版</h3>
      <p>完整技术设计文档<br>架构图、模型选型、代码方案</p>
      <div class="badge">11 章节 · 15 页</div>
    </a>
  </div>

  <div class="footer">
    长江勘测规划设计有限责任公司 · 水环院 · <span>WaterMonitor v1.0</span> · 2026
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.5 + 0.5,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.5 + 0.2
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 212, 170, ${p.alpha})`;
      ctx.fill();

      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;
    }

    // Draw connections
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(0, 212, 170, ${0.06 * (1 - dist / 120)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

</body>
</html>
