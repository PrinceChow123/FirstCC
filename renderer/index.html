<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container" data-mode="focus">
    <header class="app-header">
      <h1>Pomodoro</h1>
      <div class="session-dots">
        <span class="dot" data-index="0"></span>
        <span class="dot" data-index="1"></span>
        <span class="dot" data-index="2"></span>
        <span class="dot" data-index="3"></span>
      </div>
    </header>

    <main class="app-main">
      <div class="timer-section">
        <div class="timer-ring-wrapper">
          <svg class="timer-ring" viewBox="0 0 200 200">
            <circle class="ring-bg" cx="100" cy="100" r="90" />
            <circle class="ring-progress" cx="100" cy="100" r="90" />
          </svg>
          <div class="timer-center">
            <span class="timer-time" id="timer-time">25:00</span>
            <span class="timer-label" id="timer-label">Focus</span>
          </div>
        </div>

        <div class="current-task" id="current-task">
          <span class="current-task-label">聚焦于：</span>
          <span class="current-task-name" id="current-task-name">---</span>
        </div>

        <div class="timer-controls">
          <button class="btn btn-start" id="btn-start">Start</button>
          <button class="btn btn-pause" id="btn-pause" disabled>Pause</button>
          <button class="btn btn-reset" id="btn-reset">Reset</button>
        </div>
      </div>

      <div class="mode-selector">
        <button class="mode-btn active" data-mode="focus">Focus</button>
        <button class="mode-btn" data-mode="shortBreak">Short Break</button>
        <button class="mode-btn" data-mode="longBreak">Long Break</button>
      </div>

      <div class="task-section">
        <h2>Tasks</h2>
        <div class="task-input-row">
          <input
            type="text"
            id="task-input"
            placeholder="What are you working on?"
            maxlength="120"
          />
          <button class="btn btn-add" id="btn-add">+</button>
        </div>
        <ul class="task-list" id="task-list"></ul>
      </div>
    </main>

    <footer class="app-footer">
      <small id="session-stats">Today: 0 sessions completed</small>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
